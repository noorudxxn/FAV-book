<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center">Feedback Form</h1>
      <div class="form-group">
        <label for="name">Name:</label>
        <input
          type="name"
          class="form-control"
          id="name"
          placeholder="Enter your full name"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Enter email"
          name="email"
        />
      </div>
      <div class="form-group">
        <label for="msg">Feedback Message</label><br />
        <textarea name="feedback" rows="3" id="msg" class="form-control">
give a feedback message</textarea
        >
      </div>
    <div class="form-group">
    <label for="source">How did you hear about us?</label>

    <select class="form-control" id="source" name="source">
        <option value="" selected disabled>Select an option</option>
        <option>Google Search</option>
        <option>Social Media</option>
        <option>Friend or Colleague</option>
        <option>Advertisement</option>
        <option>Website</option>
        <option>Event or Seminar</option>
        <option>Other</option>
    </select>
</div>
      <p>Satisfaction Level</p>
      <div class="form-check-inline mb-2">
        <label class="form-check-label">
          <input type="radio" class="form-check-input" name="optradio" />1
        </label>
      </div>
      <div class="form-check-inline mb-2">
        <label class="form-check-label">
          <input type="radio" class="form-check-input" name="optradio" />2
        </label>
      </div>
      <div class="form-check-inline mb-2">
        <label class="form-check-label">
          <input type="radio" class="form-check-input" name="optradio" />3
        </label>
      </div>
      <div class="form-check-inline mb-2">
        <label class="form-check-label">
          <input type="radio" class="form-check-input" name="optradio" />4
        </label>
      </div>
      <div class="form-check-inline mb-2">
        <label class="form-check-label">
          <input type="radio" class="form-check-input" name="optradio" />5
        </label>
      </div>
      <button type="submit" class="btn btn-info d-flex justify-content-center">
        Submit
      </button>
    </div>
  </body>
</html>
