<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
</head>
<body>
<div class="container">
    <div class="container-box" style="margin: 50px auto; padding: 30px; border-radius: 10px; " >
    <nav>
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Courses</a></li>
            <li class="breadcrumb-item active"><a href="#">Web Development</a></li>
        </ul>
    </nav>
    <h2 class="text-center mb-4">Web Development Courses <span class="badge badge-primary">New</span></h2>
    <div class="Progress">
        <label class="fw-bold">HTML</label>
        <div class="progress-bar mb-4 progress-bar-striped progress-bar-animated bg-success" style="width: 100%; height: 25px;">HTML - 100%</div>
        <label class="fw-bold">CSS</label>
        <div class="progress-bar mb-4 progress-bar-striped progress-bar-animated bg-primary" style="width: 75%;">CSS - 75%</div>
        <label class="fw-bold">JavaScript</label>
        <div class="progress-bar mb-4 progress-bar-striped progress-bar-animated bg-warning" style="width: 50%;">JavaScript - 50%</div>
        <label class="fw-bold">Bootstrap</label>
        <div class="progress-bar mb-4 progress-bar-striped progress-bar-animated bg-danger" style="width: 25%; height: 25px;">Bootstrap - 25%</div>
    </div>
    <div class="botton-group mb-4" style="display: flex; justify-content: center; gap: 10px ;">
        <button class="btn btn-success">Start</button>
        <button class="btn btn-warning">Pause</button>
        <button class="btn btn-danger">Reset</button>
    </div>
    <nav>
    <ul class="pagination" style="justify-content: center;">
        <li class="page-item active"><a href="#" class="page-link ">1</a></li>
        <li class="page-item"><a href="#" class="page-link ">2</a></li>
        <li class="page-item disabled"><a href="#" class="page-link ">3</a></li>
    </ul>
    </nav>
</div>
</div>
     <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
      crossorigin="anonymous"
    ></script>
</body>
</html>
