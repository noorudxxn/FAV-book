<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Dashboard</title>
   <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container">
    <div class="container-box" >
    <nav>
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Courses</a></li>
            <li class="breadcrumb-item active">Web Development</li>
        </ul>
    </nav>
    <h2 class="text-center mb-4">Web Development Courses <span class="badge badge-primary">New</span></h2>
    <h5 class="fw-bold">HTML</h5>
    <div class="progress" style="width: 100%; height: 25px;">
        
        <div class="progress-bar mb-4 progress-bar-striped progress-bar-animated bg-success" style="width: 100%; height: 25px;">HTML - 100%</div>
        </div>
        <h5 class="fw-bold">CSS</h5>
        <div class="progress mb-4" style="width: 100%; height: 25px;">
        
        <div class="progress-bar mb-4 progress-bar-striped progress-bar-animated bg-primary" style="width: 75%; height: 25px;">CSS - 75%</div>
        </div>
        <h5 class="fw-bold">JavaScript</h5>
        <div class="progress mb-4" style="width: 100%; height: 25px;">
        
        <div class="progress-bar mb-4 progress-bar-striped progress-bar-animated bg-warning" style="width: 50%; height: 25px;">JavaScript - 50%</div>
        </div>
        <h5 class="fw-bold">Bootstrap</h5>
        <div class="progress mb-4" style="width: 100%;height: 25px;">
        
        <div class="progress-bar mb-4 progress-bar-striped progress-bar-animated bg-danger" style="width: 25%; height: 25px;">Bootstrap - 25%</div>
     </div>
    <div class="botton-group mb-4" style="display: flex; justify-content: center; gap: 10px ;">
        <button class="btn btn-success">Start</button>
        <button class="btn btn-warning">Pause</button>
        <button class="btn btn-danger">Reset</button>
    </div>
    <nav>
    <ul class="pagination" style="justify-content: center;">
        <li class="page-item active"><a href="#" class="page-link ">1</a></li>
        <li class="page-item"><a href="#" class="page-link ">2</a></li>
        <li class="page-item disabled"><a href="#" class="page-link ">3</a></li>
    </ul>
    </nav>
</div>
</div>
</body>
</html>
