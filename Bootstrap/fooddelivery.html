<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-color:#f8f9fa;
        }
        header{
            background-color:#198754;
            color:white;
            padding:15px 0;
        }
        .food-img{
            width:100%;
        }
        footer{
            background-color:#212529;
            color:white;
            padding:15px;
            margin-top:40px;
            text-align:center;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h3>FoodExpress</h3>
                </div>

                <div class="col-md-6 text-md-end">
                    <a href="#" class="text-white text-decoration-none me-3">Home</a>
                    <a href="#" class="text-white text-decoration-none">Contact</a>
                </div>
            </div>
        </div>
    </header>
    <div class="container my-5">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h2>Welcome to FoodExpress</h2>
                <p>
                    We deliver your favorite meals quickly and safely right to
                    your doorstep. Choose from a wide variety of restaurants,
                    enjoy fresh food, and experience fast delivery with just a
                    few clicks.
                </p>
            </div>
            <div class="col-md-4 text-center mt-4 mt-md-0">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500"
                     alt="Food Image"
                     class="img-fluid food-img">
            </div>

        </div>
    </div>
    <footer>
        <p>&copy; 2026 FoodExpress. All Rights Reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
