<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container ">
      <h2 class="text-center">sample Forms</h2>
      <div class="row">
        <div class="col-sm mb-2">
          <label for="usr">username:</label>
          <input
            type="text"
            id="usr"
            class="form-control"
            placeholder="enter the username" />
        </div>
        <div class="col-sm mb-2">
          <label for="email">Email:</label>
          <input
            type="email"
            class="form-control"
            placeholder="Enter the email" />
        </div>
      </div>
    <div class="row">
        <div class="col-sm mb-2">
        <label for="name" >name:</label>
        <input
          type="text"
          id="name"
          class="form-control"
          placeholder="enter the name"/>
        </div>
        <div class="col-sm mb-2">
            <label for="file"> Profile Image:</label>
        <input type="file" class="form-control-file border" name="file" id="file">
        </div>
      </div>
      <div class="row">
        <div class="col-sm mb-2">
             <label for="pwd">Password:</label>
             <input type="password" class="form-control" id="pwd" Placeholder="Enter Password">
        </div>
        <div class="col-sm mb-2">
             <label for="pwd1">Confirm Password:</label>
  <input type="password" class="form-control" id="pwd1" Placeholder="Re-enter Password">
        </div>
      </div>
      <div class="row">
        <div class="col-sm mt-2 mb-2">
              <button type="submit" class="btn btn-info d-block mx-auto">Submit</button>
        </div>
      </div>
    </div>
  </body>
</html>
