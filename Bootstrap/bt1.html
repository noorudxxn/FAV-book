<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bt1exam</title>
     <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body class="bg-primary">
    <div class="container">
        <div class="row justify-content-center align-items-center mt-5">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="bg-white p-4 shadow">
                    <h1 class="font-weight-bold">Sign Up</h1>
                    <p class="text-muted">Please fill in this form to create an account!</p>
                    <hr>
                    <form>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <input type="text" class="form-control border-0 bg-light" placeholder="First Name">
                            </div>
                                <div class="form-group col-md-6">
                                    <input type="text" class="form-control border-0 bg-light" placeholder="last Name">
                                </div>
                        </div>
                            <div class="form-group">
                                <input type="email" class="form-control border-0 bg-light" placeholder="Email">
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control border-0 bg-light" placeholder="Password">
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control border-0 bg-light" placeholder="Confirm password"> 
                            </div>
                            <div class="form-group form-check">
                                <input type="checkbox" class="form-check-input" id="terms">
                                <label for="terms" class="form-check-label">
                                    I accept the 
                                    <a href="#">Terms of Use</a>
                                    &
                                    <a href="#">Privacy Policy</a>.
                                </label>
                            </div>
                            <button type="submit"class="btn btn-info px-5 font-weight-bold">Sign Up</button>
                    </form>
                        <p class="text-center text-white mt-3">Already have an account?
                        <a href="#" class="text-white "><u>Login here.</u></a></p>
                </div>
            </div>    
        </div>
    </div>
</body>
</html>
