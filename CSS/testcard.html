<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{
         font-family: "Poppins", sans-serif;
        
        }
        body{
            background: rgb(189, 183, 246);
            justify-content: center;
            align-items: center;
            margin: 280px;
        }
        div.main{
            width: 300px;
            height: 210px;
            background: rgb(255, 255, 255);
            padding: 8px;
            padding-bottom: 100px;
            border-radius: 10px;
            margin: auto;
        }
        div.sub{
            background: rgb(244, 127, 127);
            padding: 18px;
            border-radius: 5px;
        }
        span{
                background-color: lightgray;
                border-radius: 21px;
                padding: 5px;
                margin: 1px;
                display: flex;
                
                
        }
        .box{
            margin:2px ;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .exp
        {  
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .exp i 
        {
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;    
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="sub">
            <h2>Copywriting</h2>
            <p>Delivers persuative and creative content</p>
           <div class="box"> <span >Blog posts</span><span>Video scripts</span></div> 
           <div class="box"><span>sales pages</span><span>Slogans</span></div>
        </div>
        <div class="exp">
            <span>Explore</span>
            <i class="bi  bi-arrow-right"></i>
        </div>
    </div>
</body>
</html>
